<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <title>Review Product</title>
</head>
<body>
    
    <heading align="center">
        <h4>Welcome to MyGrocery webapp<br>Fresh veggies and groceries!</h4>
    </heading>
    <br>
    <a href="{{url_for('dashboard')}}">Home</a>|
    <a href="/profile">Profile</a>|
    <a href="/buy">Cart</a>|
    <a href="{{url_for('logout')}}">Logout</a>
    <div class="container-sm">
    <div><br>
        <h4>Review the product</h4>
        <form action="/{{cart.c_id}}/review" method="POST" id="cart">
            <div>
                <label>Product Id:</label>
                <input type="text" name="p_id" value="{{cart.p_id}}" disabled />
            </div><br>
            <div>
                <label>Product name:</label>
                <input type="text" name="p_name" value="{{cart.p_name}}" disabled />
            </div><br>
            <div>
                <label>Product Price:</label>
                <input type="text" name="p_price" value="{{cart.price}}" disabled />
            </div><br>
            <div>
                <label for="quantity">Quantity:</label>
                <input type="text" name="quantity" value="{{cart.quantity}}" required />   
            </div><br>
            <div>
                <button type="submit" class="btn btn-danger">Delete</button>
            </div>
        </form><br>
       
    </div><br><br>
    <Footer align = "center">Copyright 2023 | Designed by 21f1000895</Footer>
</body>
</html>
