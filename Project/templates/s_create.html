<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <title>Create Section</title>
</head>
<body>
    
    <heading align="center">
        <h4>Welcome to MyGrocery webapp<br>Fresh veggies and groceries!</h4>
    </heading>
    <div>
        <a href="/admin_dashboard">Home</a>|
        <a href="/">Logout</a>
    </div></div>
    <br>
    <div class="container-sm">
    Available Sections are:
    <table>
        <tr>
            <th>Section Name</th>
        </tr>
        {% for i in section %}
        <tr>
            <td> {{i.section_name}}</td>   
        </tr>
        {% endfor%}
    </table><br>
    <div>
        <form action="/admin/create" method="POST" id="create_section">
            <div>
                <label>New Section Name:</label>
                <input type="text" name="section" value=""/>
        
                <input type="submit" value="Save">
            </div>
        </form>
    </div><br>
     <br><br>
    <Footer align = "center">Copyright 2023 | Designed by 21f1000895</Footer> 
</body>
</html>
