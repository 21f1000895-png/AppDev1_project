<body><div>

        <p>Recently bought items are:</p>
        <table>
            <tr>
                <th>Products</th>
            </tr>
            {% for d in data|sort(attribute='p_id',reverse=true) %}

                <td>{{d}}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
 </div>
</div>
