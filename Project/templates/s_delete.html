    <title>Delete Section</title>

<body>
    <heading align="center">
        <h4>Welcome to MyGrocery webapp<br>Fresh veggies and groceries!</h4>
    </heading>
    <br>
  <br><div border="1" class="container">
    <b> Deleting the section will also delete all the products under the section. </b><br>
    Are you sure you want to delete?<br><br>
            <form action="/admin/{{section.section_id}}/delete" method="POST" id="update_section">
                <div>
                    <label>Section Name:</label>
                    <input type="text" name="deletesection" value="{{section.section_name}}" disabled/><br>
                    
                    <button type="submit" class="btn btn-danger">Yes</button>
                    
                    <a href="/admin_dashboard" type="button" class="btn btn-primary">No</a>
                </div>
            </form>
        
    </div>  
</form><br><br><br><br>
